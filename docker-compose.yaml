services:
  postgres:
    image: postgres:16-alpine
    container_name: course-aura-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_aura_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-course_aura_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aura-network
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: course-aura-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@aura.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - aura-network

  # Local SMTP sink for verification codes and reset links (UI: http://localhost:8025)
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: course-aura-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - aura-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  aura-network:
    driver: bridge
