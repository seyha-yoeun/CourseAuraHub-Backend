services:
  postgres:
    image: postgres:16-alpine
    container_name: course-aura-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_aura_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-course_aura_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aura-network
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: course-aura-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@aura.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - aura-network

  # Local SMTP sink for verification codes and reset links (UI: http://localhost:8025)
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: course-aura-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - aura-network

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: root@123
    volumes:
      - ./minio/data:/data
      - ./minio/minio.license:/minio.license:ro
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001" --license /minio.license
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aura-network

  # Creates the bucket once MinIO is up. Only public/ can be read without a signed link.
  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21
    container_name: course-aura-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_USER: root
      MINIO_PASSWORD: root@123
      BUCKET: ${STORAGE_BUCKET:-course-aura}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_USER $$MINIO_PASSWORD &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc anonymous set download local/$$BUCKET/public
      "
    networks:
      - aura-network

volumes:
  minio_data:
    driver: local
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  aura-network:
    driver: bridge
