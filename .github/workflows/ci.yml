name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers starts its own PostgreSQL, so no secrets or services are needed here
      - name: Build and test
        run: sh ./mvnw -B verify
      # Annotations are readable without downloading the logs. GitHub keeps ten of each level.
      - name: Summarize test failures
        if: failure()
        run: |
          grep -h -A1 -E "<<< (FAILURE|ERROR)" target/surefire-reports/*.txt \
            | grep -v '^--' | paste - - | cut -c1-400 > failures.txt || true
          echo "::notice::$(wc -l < failures.txt) tests failed"
          sed -n '1,10p' failures.txt | sed 's/^/::error::/'
          sed -n '11,20p' failures.txt | sed 's/^/::warning::/'
          sed -n '21,29p' failures.txt | sed 's/^/::notice::/'
