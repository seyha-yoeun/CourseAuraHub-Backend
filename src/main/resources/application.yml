server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: course-aura-hub

  datasource:
    url: ${DATABASE_URL:${DATABASE_URL_POOLED:jdbc:postgresql://localhost:5432/course_aura_db}}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

  # SMTP delivery for verification codes, reset links and security notices.
  # Defaults target a local Mailpit (docker compose); set real credentials via env vars.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google
          github:
            client-id: ${GITHUB_CLIENT_ID:github-client-id-placeholder}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret-placeholder}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: GitHub
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:facebook-client-id-placeholder}
            client-secret: ${FACEBOOK_CLIENT_SECRET:facebook-client-secret-placeholder}
            scope:
              - public_profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Facebook


jwt:
  # Required. At least 32 random bytes, e.g. `openssl rand -base64 48`. Startup fails if missing or weak.
  secret: ${JWT_SECRET:}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

app:
  payment:
    # Payment gateway id. Empty disables paid checkout; "fake" is for development only.
    provider: ${PAYMENT_PROVIDER:}
    currency: ${PAYMENT_CURRENCY:USD}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}

  storage:
    # S3-compatible storage. Defaults match the MinIO in docker-compose; a blank endpoint turns uploads off.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    # Address browsers use, when it differs from the endpoint above
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
    # Base URL for public files, such as a CDN in front of the bucket
    public-url: ${STORAGE_PUBLIC_URL:}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:course-aura}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}

  certificates:
    # Frontend verification page. Printed on certificates, so it must be the public production URL.
    verify-url: ${CERTIFICATE_VERIFY_URL:http://localhost:3000/certificates}

  reports:
    # When the weekly report goes out, if it is switched on in Settings. Default: Mondays at 08:00, server time.
    weekly-cron: ${WEEKLY_REPORT_CRON:0 0 8 * * MON}

  telegram:
    # Bot from @BotFather. A blank token turns Telegram off.
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    # Public webhook URL ending in /api/v1/telegram/webhook. Blank polls Telegram, for local development.
    webhook-url: ${TELEGRAM_WEBHOOK_URL:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    poll-interval: ${TELEGRAM_POLL_INTERVAL:PT3S}
    # Frontend origin that notification links open in
    app-url: ${TELEGRAM_APP_URL:http://localhost:3000}

  demo-data:
    # Opt-in import of the bundled frontend mock dataset. Never overwrites existing rows.
    enabled: ${DEMO_DATA_ENABLED:false}
    file: ${DEMO_DATA_FILE:demo/demo-data.json}

  oauth2:
    # URL to redirect the user after OAuth2 login succeeds (clean redirect, tokens in cookies)
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}

  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:lax}
    domain: ${COOKIE_DOMAIN:}
    access-token-name: ${COOKIE_ACCESS_TOKEN_NAME:access_token}
    refresh-token-name: ${COOKIE_REFRESH_TOKEN_NAME:refresh_token}
    path: ${COOKIE_PATH:/}
    # Token max age in seconds (access: 15min, refresh: 7 days; remember-me overrides refresh to 30 days)
    access-token-max-age: ${COOKIE_ACCESS_TOKEN_MAX_AGE:900}
    refresh-token-max-age: ${COOKIE_REFRESH_TOKEN_MAX_AGE:604800}
    http-only: ${COOKIE_HTTP_ONLY:true}

  notifications:
    # Streams close after this long; clients reconnect, which re-checks their session
    stream-timeout: ${NOTIFICATION_STREAM_TIMEOUT:15m}
    heartbeat-interval: ${NOTIFICATION_HEARTBEAT_INTERVAL:PT25S}
    max-streams-per-user: ${NOTIFICATION_MAX_STREAMS_PER_USER:5}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Upper bound on tracked client/endpoint buckets (LRU eviction)
    max-tracked-clients: ${RATE_LIMIT_MAX_TRACKED_CLIENTS:50000}
    default-rule:
      capacity: 100
      period: 1m
    # Built-in per-endpoint rules (register, login, refresh, logout, verify-email, resend-verification,
    # forgot-password, reset-password, mfa-verify) can be overridden by name, e.g.:
    # rules:
    #   login: { path: /api/v1/auth/login, capacity: 10, period: 1m }

  cors:
    # Comma-separated trusted frontend origins. Wildcards are rejected because credentials are allowed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@courseaurahub.local}
    from-name: ${MAIL_FROM_NAME:CourseAuraHub}

  security:
    bootstrap-admin:
      # Optional one-time local/bootstrap admin. Leave blank to disable.
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      # Comma-separated list of already-registered emails to promote on startup.
      promote-emails: ${BOOTSTRAP_ADMIN_PROMOTE_EMAILS:}
    auth:
      # Proxies whose X-Forwarded-For header is trusted (IPs or CIDRs, comma-separated). Empty = trust none.
      trusted-proxies: ${TRUSTED_PROXIES:}
      token-retention: 7d
      email-verification:
        code-length: ${EMAIL_OTP_LENGTH:6}
        code-ttl: ${EMAIL_OTP_TTL:10m}
        max-attempts: ${EMAIL_OTP_MAX_ATTEMPTS:5}
        resend-cooldown: ${EMAIL_OTP_RESEND_COOLDOWN:60s}
        max-codes-per-hour: ${EMAIL_OTP_MAX_PER_HOUR:5}
      password-reset:
        token-ttl: ${PASSWORD_RESET_TTL:30m}
        request-cooldown: ${PASSWORD_RESET_COOLDOWN:60s}
        max-requests-per-hour: ${PASSWORD_RESET_MAX_PER_HOUR:5}
        # Frontend page that reads ?token= and calls POST /api/v1/auth/reset-password
        reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/auth/reset-password}
      lockout:
        max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
        lock-duration: ${LOGIN_LOCK_DURATION:15m}
      session:
        max-active-per-user: ${SESSION_MAX_ACTIVE_PER_USER:10}
        remember-me-ttl: ${SESSION_REMEMBER_ME_TTL:30d}
        # Window in which a just-rotated refresh token is rejected without revoking the session (parallel refreshes)
        reuse-grace-period: ${SESSION_REUSE_GRACE_PERIOD:10s}
      mfa:
        issuer: ${MFA_ISSUER:CourseAuraHub}
        # Base64 32-byte AES key (`openssl rand -base64 32`). 2FA enrollment is unavailable when empty.
        encryption-key: ${MFA_ENCRYPTION_KEY:}
        challenge-ttl: 5m
        max-challenge-attempts: 5
        recovery-code-count: 10
      oauth2:
        trust-facebook-email: ${OAUTH2_TRUST_FACEBOOK_EMAIL:false}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# Bind-parameter tracing (org.hibernate.orm.jdbc.bind) would log password and token hashes; keep it off.
logging:
  level:
    root: INFO
    com.course_aura_hub: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
